[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shocker-calc"
version = "1.5.15"
description = "Refrigeration Calc — kalkulator zapotrzebowania chłodu dla procesu zamrażania (desktop + mobile)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Sebastian Milczarek", email = "" },
]
license = { text = "LicenseRef-RefrigerationCalc-Proprietary-1.0" }
keywords = ["chłodnictwo", "zamrażanie", "kalkulator", "HVAC", "refrigeration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "Pillow==12.3.0",
  "reportlab==5.0.0",
  "pypdf==6.15.0",
]

[project.optional-dependencies]
desktop = ["ttkbootstrap==1.20.4"]
mobile = ["kivy==2.3.1", "kivymd==1.2.0"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.1", "mypy==2.3.0"]

[project.scripts]
shocker-calc = "tpof.desktop.app:main"

[tool.setuptools.packages.find]
include = ["tpof*"]
exclude = ["tests*", "archive*"]

[tool.setuptools.package-data]
tpof = ["../assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=tpof --cov=tools --cov-report=term-missing --cov-fail-under=50"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
# E501 (line length) and B905 (zip strict changes behavior) are adopted gradually.
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
# Pure, framework-independent modules only. The Kivy UI (mobile/app.py) and the
# Tkinter UI (desktop/app.py) use heavy dynamic attributes and are excluded.
files = [
    "tpof/core",
    "tpof/labor",
    "tpof/mobile/constants.py",
    "tpof/mobile/catalog.py",
    "tpof/mobile/i18n.py",
    "tpof/mobile/theme.py",
    "tpof/mobile/layout.py",
    "tpof/mobile/navigation.py",
    "tpof/mobile/shell.py",
    "tpof/mobile/form_interactions.py",
    "tpof/mobile/localization.py",
    "tpof/mobile/settings_state.py",
    "tpof/mobile/validation.py",
    "tpof/mobile/telemetry.py",
    "tpof/mobile/user_data.py",
    "tpof/mobile/entitlements.py",
    "tpof/mobile/paths.py",
    "tpof/mobile/accessibility.py",
    "tpof/mobile/android_bridge.py",
    "tpof/mobile/pdf_export.py",
    "tpof/mobile/services/monetization.py",
    "tpof/mobile/services/rewarded_access.py",
    "tpof/mobile/services/user_feedback.py",
    "tpof/mobile/dialogs/labor_rates.py",
    "tpof/mobile/dialogs/custom_product.py",
    "tpof/mobile/dialogs/legal.py",
    "tpof/mobile/dialogs/privacy.py",
    "tpof/mobile/dialogs/settings.py",
    "tpof/mobile/tabs/labor.py",
    "tpof/mobile/tabs/labor_results.py",
    "tpof/mobile/tabs/labor_workflow.py",
    "tpof/mobile/tabs/valves.py",
    "tools/verify_android_legal_bundle.py",
    "tools/verify_android_abi_bundle.py",
    "tools/verify_android_16kb_alignment.py",
    "tools/verify_android_firebase_manifest.py",
    "tools/verify_android_permissions.py",
    "tools/verify_android_network_security.py",
    "tools/verify_android_python_packages.py",
    "tools/generate_android_sbom.py",
]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
